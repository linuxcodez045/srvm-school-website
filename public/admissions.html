<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admission Enquiry | SRVM</title><link rel="stylesheet" href="/assets/form.css"></head><body><main class="wrap"><a class="back" href="/">← Back to school website</a><div class="form-card"><div class="eyebrow">SHREE RAM VIDHYA MANDIR · ADMISSIONS</div><h1>Begin your child's journey.</h1><p>Fill this form and your enquiry will be saved directly in the school's admin panel.</p><form id="form"><div><label>Student Name *</label><input name="studentName" required></div><div><label>Class Applying For *</label><select name="classApplying" id="classApplying" required><option value="">Loading classes…</option></select></div><div><label>Parent / Guardian Name *</label><input name="parentName" required></div><div><label>Phone *</label><input name="phone" type="tel" required></div><div><label>Email</label><input name="email" type="email"></div><div><label>Previous School</label><input name="previousSchool"></div><div class="full"><label>Address</label><textarea name="address"></textarea></div><div class="full"><label>Message / Requirement</label><textarea name="message"></textarea></div><button type="submit" class="submit">Submit Admission Enquiry →</button><div id="msg" class="msg"></div></form></div></main><script>
async function fetchJson(url,options={},timeoutMs=15000){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),timeoutMs);
 try{
  const r=await fetch(url,{...options,signal:controller.signal,cache:"no-store"});
  const text=await r.text();
  let data={};
  try{data=text?JSON.parse(text):{}}catch{data={error:text||"Server returned an invalid response."};}
  if(!r.ok)throw new Error(data.error||`Request failed (${r.status})`);
  return data;
 }catch(e){if(e.name==="AbortError")throw new Error("The server took too long to respond. Please try again.");throw e}
 finally{clearTimeout(timer)}
}
(async function loadClasses(){
 const select=document.getElementById("classApplying");
 try{
  const classes=await fetchJson("/api/classes");
  const list=Array.isArray(classes)?classes:[];
  select.innerHTML='<option value="">Select class</option>'+list.map(x=>{const name=String(x?.name??x);const esc=name.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");return `<option value="${esc}">${esc}</option>`}).join("");
  if(!list.length)select.innerHTML='<option value="">No admission classes are currently available</option>';
 }catch(e){select.innerHTML='<option value="">Unable to load classes</option>';console.error(e)}
})();

document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const form=e.currentTarget,msg=document.getElementById("msg"),button=form.querySelector("button[type=submit]");
 msg.textContent="Submitting…";msg.style.color="";button.disabled=true;
 try{
  const data=Object.fromEntries(new FormData(form));
  const j=await fetchJson("/api/admissions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  form.reset();msg.textContent="✓ Thank you. Your admission enquiry has been sent to the school.";msg.style.color="#177245";
 }catch(err){msg.textContent=err.message||"Could not submit. Please try again.";msg.style.color="#a22";console.error("Admission submission error:",err)}
 finally{button.disabled=false}
});
</script></body></html>
