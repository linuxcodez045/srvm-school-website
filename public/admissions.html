<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admission Enquiry | SRVM</title><link rel="stylesheet" href="/assets/form.css"></head><body><main class="wrap"><a class="back" href="/">← Back to school website</a><div class="form-card"><div class="eyebrow">SHREE RAM VIDHYA MANDIR · ADMISSIONS</div><h1>Begin your child's journey.</h1><p>Fill this form and your enquiry will be saved directly in the school's admin panel.</p><form id="form"><div><label>Student Name *</label><input name="studentName" required></div><div><label>Class Applying For *</label><select name="classApplying" id="classApplying" required><option value="">Loading classes…</option></select></div><div><label>Parent / Guardian Name *</label><input name="parentName" required></div><div><label>Phone *</label><input name="phone" type="tel" required></div><div><label>Email</label><input name="email" type="email"></div><div><label>Previous School</label><input name="previousSchool"></div><div class="full"><label>Address</label><textarea name="address"></textarea></div><div class="full"><label>Message / Requirement</label><textarea name="message"></textarea></div><button class="submit">Submit Admission Enquiry →</button><div id="msg" class="msg"></div></form></div></main><script>
(async function loadClasses(){
  const select=document.getElementById("classApplying");
  try{
    const r=await fetch("/api/classes",{cache:"no-store"});
    const classes=await r.json();
    select.innerHTML='<option value="">Select class</option>'+classes.map(x=>`<option value="${String(x.name??x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}">${String(x.name??x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}</option>`).join("");
  }catch(e){
    select.innerHTML='<option value="">Unable to load classes</option>';
  }
})();
</script><script>document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget,msg=document.getElementById("msg"),button=form.querySelector("button[type=submit]");msg.textContent="Submitting…";button.disabled=true;try{const r=await fetch("/api/admissions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const j=await r.json();if(!r.ok)throw new Error(j.error||"Could not submit.");form.reset();msg.textContent="✓ Thank you. Your admission enquiry has been sent to the school.";msg.style.color="#177245"}catch(err){msg.textContent=err.message||"Could not submit.";msg.style.color="#a22"}finally{button.disabled=false}})</script></body></html>
